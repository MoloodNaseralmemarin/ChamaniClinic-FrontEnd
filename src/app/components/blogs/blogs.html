<section class="py-5 bg-light" aria-labelledby="blogs-title" id="blog">
  <div class="container">
        <h2 id="blogs-title" class="h4 text-center mb-4">آخرین مطالب</h2>

    <div class="row g-4">
      <!-- رویداد 1 -->
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let blog of blogs">
        <article class="card h-100 shadow-sm border-0">
          <img [src]="'images/' + blog.imageUrl" class="card-img-top" alt="تصویر رویداد 1" />

          <div class="card-body">
            <h3 class="h5 card-title mb-2">
              <a href="single.html" class="stretched-link text-decoration-none text-dark">
                {{ blog.title }}
              </a>
            </h3>
            <div class="d-flex align-items-center gap-2 small text-muted mb-2">
              <i class="fas fa-regular fa-clock"></i>
              <time datetime="2015-08-08T11:00">{{blog.createdDate}}</time>
            </div>
            <p class="card-text mb-0">
              {{blog.shortDescription}}
            </p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
